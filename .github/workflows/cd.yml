# Continuous Deployment Workflow
# Triggered on push to main branch
# Builds Docker images, pushes to GHCR, and deploys to DigitalOcean

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/vxness

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push HTTP Server
      - name: Build and push HTTP Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/httpServer/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-http-server:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-http-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Trading Engine
      - name: Build and push Trading Engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/tradingEngine/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-trading-engine:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-trading-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Price Poller
      - name: Build and push Price Poller
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/pricePoller/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-price-poller:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-price-poller:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Web App
      - name: Build and push Web App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment files
        run: |
          mkdir -p deploy
          cp docker-compose.prod.yml deploy/docker-compose.yml

      - name: Upload deployment configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DIGITALOCEAN_HOST }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /opt/vxness
          strip_components: 1

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DIGITALOCEAN_HOST }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          script: |
            # Create and navigate to app directory
            mkdir -p /opt/vxness
            cd /opt/vxness

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Create/update .env file
            cat > .env << 'EOF'
            ${{ secrets.PRODUCTION_ENV }}
            EOF

            cat >> .env << 'EOF'
            IMAGE_TAG=${{ github.sha }}
            REGISTRY=${{ env.REGISTRY }}
            IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            EOF

            # Pull new images
            docker compose pull

            # Run checked-in, non-destructive database migrations
            docker compose run --rm -w /app/packages/db http-server bunx prisma migrate deploy

            # Restart services
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -af --filter "until=24h"

            # Health check
            sleep 15
            docker compose exec -T http-server bun -e "const response = await fetch('http://localhost:3000/health'); process.exit(response.ok ? 0 : 1)"
            curl -fk https://localhost/nginx-health || exit 1
